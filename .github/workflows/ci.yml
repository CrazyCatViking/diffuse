name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-latest
          - platform: mac-arm64
            runner: macos-latest
          - platform: win-x64
            runner: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: clippy,rustfmt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Test core
        working-directory: core
        run: zig build test

      - name: Build core
        working-directory: core
        run: zig build -Doptimize=ReleaseSafe

      - name: Check Rust core
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked
          cargo build --workspace --locked
          cargo build --workspace --release --locked

      - name: Install app dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Stage and test release native addon
        working-directory: app
        run: |
          pnpm native:stage:release
          pnpm test:native:all

      - name: Test core RPC integration
        working-directory: app
        run: pnpm test:integration

      - name: Test complete Rust RPC parity
        working-directory: app
        run: pnpm test:rust-integration

      - name: Build and test app
        working-directory: app
        run: pnpm build

      - name: Assemble and smoke unpacked package
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          pnpm prepare:electron
          pnpm exec electron-builder --dir
          pnpm smoke:native:packaged

      - name: Check app formatting
        working-directory: app
        run: pnpm format:check
