name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-latest
          - platform: mac-arm64
            runner: macos-latest
          - platform: win-x64
            runner: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Test core
        working-directory: core
        run: zig build test

      - name: Build core
        working-directory: core
        run: zig build

      - name: Install app dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Test core RPC integration
        working-directory: app
        run: pnpm test:integration

      - name: Build and test app
        working-directory: app
        run: pnpm build

      - name: Check app formatting
        working-directory: app
        run: pnpm format:check
